# Next.js on Netlify — let the official plugin handle publish output.
[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # Admin and voice keys are read on the server. Webpack still stores them in its cache.
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAIL,ADMIN_PASSWORD,ADMIN_SESSION_SECRET,SARVAM_API_KEY,GEMINI_API_KEY"
  # The cache is not published. The scan hits are only in this pack file.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**,.next/cache/**"

# Allow longer serverless time for Gemini chat (capped by plan).
[functions]
  node_bundler = "esbuild"

[functions."*"]
  timeout = 26

# Reminders: ping GET /api/cron/reminders with Authorization: Bearer $CRON_SECRET
# (Netlify scheduled function, cron-job.org, or Admin → Quotes → Process due reminders)
