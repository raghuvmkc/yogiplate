# Next.js on Netlify — let the official plugin handle publish output.
[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Allow longer serverless time for Gemini chat (capped by plan).
[functions]
  node_bundler = "esbuild"

[functions."*"]
  timeout = 26
