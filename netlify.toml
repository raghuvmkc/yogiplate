# Next.js on Netlify — let the official plugin handle publish output.
[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # These stay in server code only. Next still copies them into server bundles.
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAIL,ADMIN_PASSWORD,ADMIN_SESSION_SECRET"

# Allow longer serverless time for Gemini chat (capped by plan).
[functions]
  node_bundler = "esbuild"

[functions."*"]
  timeout = 26

# Reminders: ping GET /api/cron/reminders with Authorization: Bearer $CRON_SECRET
# (Netlify scheduled function, cron-job.org, or Admin → Quotes → Process due reminders)
