# Next.js on Netlify — let the official plugin handle publish output.
[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # Names, titles, emails, and voice settings are written on the public site on purpose.
  # Passwords and API keys stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAIL,ADMIN_PASSWORD,ADMIN_SESSION_SECRET,SARVAM_API_KEY,GEMINI_API_KEY,CHEF_FOUNDER_NAME,CHEF_FOUNDER_TITLE,CHEF_FOUNDER_PREFIX,MANAGER_NAME,MANAGER_TITLE,MANAGER_NOTIFY_EMAILS,MANAGER_NOTIFY_PHONES,CORPORATE_NOTIFY_EMAILS,CHAT_SUMMARY_NOTIFY_EMAILS,SMTP_HOST,SMTP_USER,SMTP_FROM_NAME,INVOICE_FROM_EMAIL,KITCHEN_ADDRESS,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_OWNER_WHATSAPP_E164,OWNER_WHATSAPP_E164,TTS_PROVIDER,TTS_VOICE,SARVAM_STT_MODEL,SARVAM_TTS_MODEL"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**,.next/cache/**"

# Allow longer serverless time for Gemini chat (capped by plan).
[functions]
  node_bundler = "esbuild"

[functions."*"]
  timeout = 26

# Reminders: ping GET /api/cron/reminders with Authorization: Bearer $CRON_SECRET
# (Netlify scheduled function, cron-job.org, or Admin → Quotes → Process due reminders)
